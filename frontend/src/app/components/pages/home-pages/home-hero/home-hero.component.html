<section class="hero">
  <div class="hero-content">
    <span class="eyebrow">
      <span class="eyebrow-dot"></span>
      Comunicação sem barreiras
    </span>

    <h1>
      Um mundo mais inclusivo começa com
      <span>Libras.</span>
    </h1>

    <p>
      Aprenda novos sinais, descubra conteúdos e aproxime pessoas por meio da
      Língua Brasileira de Sinais.
    </p>

    <div class="hero-actions">
      <a
        [routerLink]="['/categorias/categorias-list']"
        class="button button-primary"
      >
        Começar a aprender
        <span aria-hidden="true">→</span>
      </a>

      <a [routerLink]="['/posts/posts-list']" class="button button-secondary">
        Explorar conteúdos
      </a>
    </div>
  </div>
</section>
